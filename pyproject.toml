[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_saloon"
version = "0.1.0"
description = "Collaborative book writing using multi-agent systems"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [ { name = "jmcdice" } ]
dependencies = [
    "openai",
    "prompt_toolkit",
    "rich",
    "swarm @ git+https://github.com/openai/swarm.git"
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
agent-saloon = "main:main"